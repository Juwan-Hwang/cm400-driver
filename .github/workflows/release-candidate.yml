name: release-candidate

# Manual acceptance of a *signed* release candidate on a clean Windows VM. This is not PR CI and it is
# not a substitute for the hardware acceptance record: there is no CM400 here, so a successful run
# proves candidate integrity, the expected refusal without a device, the trust rollback, and the
# recovery uninstall. It never proves that a real device was driven.
#
# Where the candidate comes from: the package is signed locally (no signing key exists in CI, by
# decision), uploaded to a Draft Release for a candidate tag, and downloaded here by that tag. No
# arbitrary URL is accepted as an executable source, and the tag is passed through an environment
# variable rather than interpolated into a shell string.
#
# Credential shape, stated as it actually works rather than as assumed:
#   - both workflows set `persist-credentials: false` on actions/checkout. Its default is to persist a
#     token, and in the current major version that credential is written to a temp file whose path is
#     handed to git as an extra header - so clearing an environment variable in a later step is NOT proof
#     a program cannot obtain it. Without persisted credentials there is nothing on disk to find;
#   - `contents: read` is the only permission the workflow holds (draft assets need an authenticated
#     request; unauthenticated reads of a draft 404), and the token reaches exactly one step;
#   - every step that could execute candidate code declares an empty GITHUB_TOKEN/GH_TOKEN, which is
#     defence in depth, not the primary control.
#
# Ordering rule: the read-only baseline is captured BEFORE any candidate binary runs, and re-captured
# after the verification stage. A drift between the two fails the run, so "the verify stage polluted the
# clean environment" cannot be quietly ignored.
#
# Runners are ephemeral, so "keep the scene" means every transcript and snapshot is printed into the run
# log even when a step fails.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Candidate tag whose Draft Release holds the package under test (for example v0.1.0-rc1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  # A job whose only job is to read the draft and hand the bytes over. `permissions` can be set on a
  # workflow or a job, never on a single step, so the push-level Contents token a draft release needs
  # cannot live in the same job that later executes candidate content - an Action can reach the token
  # through the `github.token` context without anyone passing it in. This job checks out nothing, builds
  # nothing, runs nothing it downloads, and its token dies with the job.
  fetch-candidate:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push-level, which is what makes a draft listable by the job token at all
    env:
      PACKAGE_DIR: ${{ github.workspace }}\candidate
      CANDIDATE_TAG: ${{ inputs.tag }}
    outputs:
      # the commit this job proved the tag points at, so the acceptance job can require its own
      # checkout to be that same commit rather than merely "a commit on the default branch"
      tag-sha: ${{ steps.read.outputs.tagsha }}
    steps:
      - id: read
        name: read the draft release and download the nine assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:PACKAGE_DIR | Out-Null
          if (-not $env:GH_TOKEN) {
            Write-Host '::error::the job token is not available; a draft release cannot be read without it'
            exit 2
          }
          $tag = $env:CANDIDATE_TAG
          if ($tag -notmatch '^[A-Za-z0-9._/-]{1,100}$') {
            Write-Host '::error::refusing an unexpected tag value; a candidate tag is not a download URL'
            exit 2
          }
          # the release notes or an unrelated tool must not become package content by accident
          $expected = @(
            'LICENSE', 'SHA256SUMS.txt', 'cm400.cat', 'cm400.cat.thumbprint.txt', 'cm400.cer',
            'cm400-setup.exe', 'cm400.inf', 'cm400ctl.exe', 'cm400d.exe'
          )
          # Measured, and the reason this is not `releases/tags/{tag}`: that endpoint answers 404 for a
          # draft, because a draft is deliberately not resolvable by tag name. Listing releases does see
          # drafts, but only for an identity with push access - which is why this job exists and the
          # acceptance job, which runs `contents: read`, cannot do this itself.
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::the release list could not be read; the candidate cannot be verified"
            Write-Host $release
            exit 2
          }
          $matches = @($release | ConvertFrom-Json | Where-Object { $_.tag_name -eq $tag })
          if ($matches.Count -ne 1) {
            Write-Host "::error::expected exactly one release for tag '$tag', found $($matches.Count); a candidate has to be published as a Draft Release first"
            exit 2
          }
          $rel = $matches[0]
          if (-not $rel.draft) {
            Write-Host "::error::the release for '$tag' is not a draft; this job judges candidates, not published releases"
            exit 2
          }
          # the tag's own object, not `target_commitish`, which can name a branch that has since moved
          $tagRef = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::the candidate tag could not be read: $tagRef"; exit 2 }
          $tagSha = ($tagRef | ConvertFrom-Json).object.sha
          if (-not $tagSha) { Write-Host '::error::the candidate tag carries no commit'; exit 2 }
          "tagsha=$tagSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "  candidate   : tag $tag -> $tagSha (job commit $env:GITHUB_SHA)"
          Write-Host "  release     : $($rel.name) (id=$($rel.id), draft=$($rel.draft), prerelease=$($rel.prerelease))"
          $assets = @($rel.assets)
          $names = @($assets | ForEach-Object { $_.name })
          $dupes = @($names | Group-Object | Where-Object { $_.Count -gt 1 })
          $unknown = @($names | Where-Object { $expected -notcontains $_ })
          $absent = @($expected | Where-Object { $names -notcontains $_ })
          if ($assets.Count -ne 9) { Write-Host "::error::expected nine assets, found $($assets.Count)"; exit 2 }
          if ($dupes.Count) { Write-Host "::error::duplicate asset names: $($dupes.Name -join ', ')"; exit 2 }
          if ($unknown.Count) { Write-Host "::error::assets that are not package content: $($unknown -join ', ')"; exit 2 }
          if ($absent.Count) { Write-Host "::error::missing package files: $($absent -join ', ')"; exit 2 }
          foreach ($a in $assets) {
            if ($a.state -ne 'uploaded') { Write-Host "::error::asset $($a.name) is in state '$($a.state)', not uploaded"; exit 2 }
            # octet-stream fetches the asset content; without the header the API returns JSON metadata
            gh api "/repos/$env:GITHUB_REPOSITORY/releases/assets/$($a.id)" `
              -H 'Accept: application/octet-stream' --output (Join-Path $env:PACKAGE_DIR $a.name)
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::asset download failed for $($a.name)"; exit 2 }
            # GitHub's own digest for the stored bytes against a hash of the bytes that arrived: two
            # independent measurements, not one number this step produced and then re-read
            if (-not $a.digest) { Write-Host "::error::asset $($a.name) carries no server-side digest"; exit 2 }
            $local = (Get-FileHash (Join-Path $env:PACKAGE_DIR $a.name) -Algorithm SHA256).Hash.ToLowerInvariant()
            $remote = $a.digest -replace '^sha256:', ''
            if ($local -ne $remote) {
              Write-Host "::error::asset $($a.name) digest mismatch: server says $remote, downloaded file is $local"
              exit 2
            }
            Write-Host ("  fetched     : {0} ({1} bytes) sha256={2} matches the release record" -f $a.name, $a.size, $local.Substring(0, 16))
          }
          if (@(Get-ChildItem $env:PACKAGE_DIR -File).Count -ne 9) {
            Write-Host '::error::the downloaded set is not exactly nine files'
            exit 2
          }

      - name: hand the candidate to the acceptance job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-assets
          path: ${{ github.workspace }}\candidate
          if-no-files-found: error
          # the fetch job's token is the only write-capable credential in this workflow; keeping the
          # artifact short-lived (one day) bounds how long the candidate bytes sit retrievable
          retention-days: 1

  clean-vm-acceptance:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: fetch-candidate
    env:
      PACKAGE_DIR: ${{ github.workspace }}\candidate
      LOG_DIR: ${{ github.workspace }}\logs
      # This job holds no credential at all: the candidate arrives as an artifact from the fetch job, so
      # nothing that builds, tests, or executes downloaded content can reach a token - blanking the
      # variable per step would not be enough, because a step can also read `github.token`.
      GITHUB_TOKEN: ''
      GH_TOKEN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No `ref: ${{ inputs.tag }}` here: that would interpolate an unvalidated input into an
          # action parameter. The run is dispatched against the candidate tag, and the step below
          # asserts the checked-out commit really is that tag's commit, failing otherwise - which is
          # both safer and louder than trusting the dispatch selection.
          persist-credentials: false

      # The catalog verifier is built here, from this checkout, and is deliberately not part of the
      # package being verified: the thing that checks cannot be the thing that is checked. Building it
      # before the baseline step keeps the drift check scoped to the verification stage.
      - name: install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          # the same pinned toolchain as windows.yml, so the verifier that judges a candidate is built
          # by a compiler the rest of the project has been tested against
          toolchain: 1.97.1

      - name: build the pinned-certificate catalog verifier
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        shell: pwsh
        run: |
          cargo build --release --locked --bin cm400-catsig
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error::the verifier could not be built; the candidate cannot be accepted'
            exit 1
          }
          $exe = if ($env:CARGO_TARGET_DIR) { Join-Path $env:CARGO_TARGET_DIR 'release\cm400-catsig.exe' } else { '' }
          if (-not $exe -or -not (Test-Path $exe)) {
            $exe = Join-Path $env:GITHUB_WORKSPACE 'target\release\cm400-catsig.exe'
          }
          if (-not (Test-Path $exe)) {
            Write-Host '::error::cm400-catsig.exe was not produced; refusing to fall back on a trust-state enum'
            exit 1
          }
          "CATSIG=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "  verifier built at $exe"

      # The candidate arrives from the fetch job, and this job never sees a token: receiving it as an
      # artifact means the write-capable credential and the code that executes the candidate are in
      # different jobs, not merely different steps.
      - name: receive the candidate assets from the fetch job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-assets
          path: ${{ github.workspace }}\candidate

      - name: this run's source is the commit the fetch job validated
        shell: pwsh
        run: |
          $want = '${{ needs.fetch-candidate.outputs.tag-sha }}'
          if (-not $want) { Write-Host '::error::the fetch job reported no candidate commit'; exit 2 }
          if ($want -ne $env:GITHUB_SHA) {
            Write-Host "::error::source is $env:GITHUB_SHA but the candidate was validated against $want; the verifier and the package must come from one commit"
            exit 2
          }
          Write-Host "  source : $env:GITHUB_SHA, matching the candidate tag"

      - name: the delivered set is still exactly the nine assets
        shell: pwsh
        run: |
          # Re-count and re-hash after a second transport. The package carries its own digest list, so the
          # files are checked against something inside the candidate rather than against a value this step
          # just produced: an artifact that arrived altered must not pass because nobody looked.
          $expected = @(
            'LICENSE', 'SHA256SUMS.txt', 'cm400.cat', 'cm400.cat.thumbprint.txt', 'cm400.cer',
            'cm400-setup.exe', 'cm400.inf', 'cm400ctl.exe', 'cm400d.exe'
          )
          $have = @(Get-ChildItem $env:PACKAGE_DIR -File)
          $extra = @($have | ForEach-Object { $_.Name } | Where-Object { $expected -notcontains $_ })
          $missing = @($expected | Where-Object { $_ -notin @($have | ForEach-Object { $_.Name }) })
          if ($extra.Count) { Write-Host "::error::unexpected files arrived: $($extra -join ', ')"; exit 2 }
          if ($missing.Count) { Write-Host "::error::files missing from the artifact: $($missing -join ', ')"; exit 2 }
          if ($have.Count -ne 9) { Write-Host "::error::expected nine files, got $($have.Count)"; exit 2 }
          # the manifest inside the package lists seven of the nine: the catalog and the manifest itself
          # cannot attest to their own bytes, so those two are covered by the catalog signature instead
          $sums = Get-Content (Join-Path $env:PACKAGE_DIR 'SHA256SUMS.txt')
          $checked = 0
          foreach ($line in $sums) {
            if ($line -notmatch '^([0-9A-Fa-f]{64})\s+(\S+)$') { Write-Host "::error::unparsable manifest line: $line"; exit 2 }
            $want = $Matches[1].ToUpperInvariant(); $name = $Matches[2]
            $path = Join-Path $env:PACKAGE_DIR $name
            if (-not (Test-Path $path)) { Write-Host "::error::manifest lists $name but it is absent"; exit 2 }
            $got = (Get-FileHash $path -Algorithm SHA256).Hash.ToUpperInvariant()
            if ($got -ne $want) { Write-Host "::error::$name digest mismatch after transport: manifest $want, file $got"; exit 2 }
            $checked++
          }
          if ($checked -ne 7) { Write-Host "::error::the manifest covers $checked files, expected 7"; exit 2 }
          Write-Host "  assets : nine files delivered, $checked digests re-verified against the package manifest"

      # before anything from the package can run, and re-used later as the drift reference
      - name: capture the pre-execution baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          .\install\ci_state_snapshot.ps1 -Out "$env:LOG_DIR\cm400-before-candidate-code.txt"

      # tamper detection is part of the evidence for this run, not a local-only courtesy: it exercises the
      # verifier against copies of the real candidate and never runs candidate code
      - name: prove the verifier rejects tampering
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        shell: pwsh
        run: |
          if (-not $env:CATSIG) { Write-Host '::error::no verifier binary was built'; exit 1 }
          .\install\ci_preverify_selftest.ps1 -PackageDir $env:PACKAGE_DIR -Catsig $env:CATSIG

      # the attack regression, against the same candidate: flipped signed content, flipped embedded
      # certificate, rebuilt member list, swapped pairs and layout smuggling - each asserted with the
      # reason it was refused, not merely that it was refused
      - name: attack regression on the downloaded candidate
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        shell: pwsh
        run: |
          if (-not $env:CATSIG) { Write-Host '::error::no verifier binary was built'; exit 1 }
          .\install\ci_catalog_attack_regression.ps1 -Package $env:PACKAGE_DIR -Catsig $env:CATSIG

      - name: verify the candidate before anything acts on it
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        shell: pwsh
        run: .\install\ci_preverify_candidate.ps1 -PackageDir $env:PACKAGE_DIR -Catsig $env:CATSIG

      # cross-check only, and deliberately after the gate above: this one asks the candidate's own
      # installer to report on its package, so it is a second opinion from inside the package, not
      # evidence that the package was accepted
      - name: the candidate's own report, as a cross-check after the gate
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        shell: pwsh
        run: .\install\ci_candidate_verify.ps1 -PackageDir $env:PACKAGE_DIR

      - name: the verification stage left the machine as it found it
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        shell: pwsh
        run: |
          .\install\ci_state_snapshot.ps1 -Out "$env:LOG_DIR\cm400-after-verify.txt" `
            -Baseline "$env:LOG_DIR\cm400-before-candidate-code.txt"

      - name: assert this is a clean environment
        shell: pwsh
        run: .\install\ci_clean_baseline.ps1 -SnapshotDir $env:LOG_DIR

      - name: device-free install, rollback and recovery uninstall
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        shell: pwsh
        run: .\install\ci_device_free_install.ps1 -PackageDir $env:PACKAGE_DIR -LogDir $env:LOG_DIR

      - name: final read-only state snapshot
        if: always()
        shell: pwsh
        run: .\install\ci_state_snapshot.ps1 -Out "$env:LOG_DIR\cm400-ci-final-state.txt"

      # Runners are ephemeral and "keep the scene" has to mean something concrete, so the transcripts and
      # snapshots are printed into the run log, which GitHub retains. The only artifact retained beyond the
      # run is the candidate itself, which the fetch job hands over with a one-day lifetime.
      - name: print the transcripts and snapshots into the run log
        if: always()
        shell: pwsh
        run: |
          foreach ($f in @(Get-ChildItem $env:LOG_DIR -File -EA SilentlyContinue)) {
            Write-Host "::group::$($f.Name)"
            Get-Content $f.FullName | ForEach-Object { "$_" }
            Write-Host '::endgroup'
          }
          if (-not @(Get-ChildItem $env:LOG_DIR -File -EA SilentlyContinue).Count) {
            Write-Host 'no log files were produced; the run failed before any step wrote one'
          }
